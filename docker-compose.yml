services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    depends_on: [qdrant]
    environment:
      QDRANT_URL: http://qdrant:6333
      REGISTRY_DB: /data/registry.db
      GROK_API_KEY: ${GROK_API_KEY:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env}
      ADMIN_KEY: ${ADMIN_KEY:-}
      EMBEDDER: ${EMBEDDER:-sentence-transformers}
      EXPORTS_DIR: /exports
    volumes:
      - registry_data:/data
      - ./exports:/exports:ro
    ports:
      - "8005:8005"

volumes:
  qdrant_data:
  registry_data:
